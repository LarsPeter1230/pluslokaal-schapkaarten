{% extends "base.html" %}
{% block title %}Instellingen – PLUSLokaal{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1 class="page-title">Instellingen</h1>
    <p class="page-sub">Beheer je account</p>
  </div>
</div>

<div class="flex">
  <!-- Wachtwoord wijzigen -->
  <div class="panel" style="flex:0 0 360px;">
    <div class="panel__head"><i class="fa fa-key"></i><h3>Wachtwoord wijzigen</h3></div>
    <div class="panel__body">
      <form method="post">
        <div class="field">
          <label>Huidig wachtwoord</label>
          <input type="password" name="current" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>Nieuw wachtwoord</label>
          <input type="password" name="new" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>Herhaal nieuw wachtwoord</label>
          <input type="password" name="new2" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="fa fa-floppy-disk"></i> Wachtwoord opslaan</button>
      </form>
    </div>
  </div>

  <!-- Account info -->
  <div class="panel" style="flex:0 0 300px;">
    <div class="panel__head"><i class="fa fa-circle-user"></i><h3>Accountinformatie</h3></div>
    <div class="panel__body stack">
      <div>
        <label>Ingelogd als</label>
        <div style="font-size:1rem;font-weight:800;">{{ user.username }}</div>
      </div>
      <div>
        <label>Rol</label>
        <div><span class="badge badge-{{ user.role }}">{{ user.role }}</span></div>
      </div>
      <div>
        <label>Filiaal</label>
        <div style="font-size:1rem;font-weight:800;">{{ filiaal_display(user.filiaal, user.filiaal_naam) }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
