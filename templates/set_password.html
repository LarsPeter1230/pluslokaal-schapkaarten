<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wachtwoord instellen | PLUS</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static',filename='img/favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static',filename='img/favicon-32.png') }}">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--dark-green:#115013;--action-green:#80bd1d;--text:#333333;--muted:#6c6c6c;--placeholder:#999999;--border:#999999;--error:#dd350d;}
html,body{min-height:100%;}
body{font-family:'Open Sans',Gotham,sans-serif;background:#fff;color:var(--text);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased;}
header.plus-header{background:var(--action-green);box-shadow:2px 1px 6px 0 rgba(51,51,51,.2);height:64px;display:flex;align-items:center;padding:0 20px;flex-shrink:0;}
.plus-header .logo img{height:34px;width:auto;object-fit:contain;}
.content-wrapper{flex:1;display:flex;justify-content:center;padding:32px 16px 48px;}
.content{width:100%;max-width:570px;}
.login-title{color:var(--dark-green);font-size:24px;font-weight:700;line-height:30px;margin-bottom:6px;}
.login-description{color:var(--muted);font-size:16px;line-height:24px;margin-bottom:20px;}
.hint-box{background:#eef6e1;border-radius:8px;padding:14px 16px;color:var(--dark-green);font-size:14px;line-height:1.5;margin-bottom:20px;}
.form-error{color:var(--error);font-size:14px;line-height:22px;margin:4px 0;}
.field{position:relative;margin-top:16px;margin-bottom:8px;}
.field input{width:100%;height:56px;padding:24px 16px 8px;font-family:inherit;font-size:16px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:8px;outline:none;transition:border-color .2s;}
.field input:focus{border:1px solid #333;}
.field label{position:absolute;left:16px;top:16px;font-size:16px;line-height:24px;color:var(--placeholder);pointer-events:none;transform-origin:top left;transition:transform .2s cubic-bezier(0,0,.2,1),color .2s;}
.field input:focus + label,.field input:not(:placeholder-shown) + label{transform:translateY(-9px) scale(.75);color:var(--dark-green);}
.field input:not(:placeholder-shown):not(:focus) + label{color:var(--placeholder);}
.btn-login{width:100%;height:48px;margin-top:16px;background:var(--action-green);color:#fff;font-family:inherit;font-size:16px;border:none;border-radius:24px 24px 24px 4px;cursor:pointer;transition:opacity .25s;}
.btn-login:hover{opacity:.94;}
footer.page-footer{border-top:1px solid #d8d8d8;padding:20px 16px;text-align:center;color:var(--muted);font-size:12px;line-height:20px;}
</style>
{% include '_csrf.html' %}
</head>
<body spellcheck="false">
<header class="plus-header">
  <div class="logo">
    <img src="{{ url_for('static',filename='img/plus-logo.svg') }}" alt="PLUS logo"
         onerror="this.parentElement.innerHTML='<span style=\'color:#fff;font-weight:800;font-size:1.3rem;\'>PLUS</span>'">
  </div>
</header>

<div class="content-wrapper">
  <div class="content">
    <h1 class="login-title">Wachtwoord instellen</h1>
    <p class="login-description">Kies een wachtwoord voor <strong>{{ username }}</strong>.</p>

    <div class="hint-box">💡 {{ hint }}</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<p class="form-error">{{ msg }}</p>{% endfor %}
    {% endwith %}

    <form method="post" novalidate>
      <div class="field">
        <input type="password" id="new" name="new" placeholder=" " required autofocus autocomplete="new-password">
        <label for="new">Nieuw wachtwoord <span>*</span></label>
      </div>
      <div class="field">
        <input type="password" id="new2" name="new2" placeholder=" " required autocomplete="new-password">
        <label for="new2">Herhaal wachtwoord <span>*</span></label>
      </div>
      <button type="submit" class="btn-login">Wachtwoord opslaan</button>
    </form>
  </div>
</div>

<footer class="page-footer">
  <div>© 2026 PLUS &bull; PLUSLokaal Schapkaarten</div>
</footer>
</body>
</html>
